name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: pnpm/action-setup@v6
        with:
          version: 9

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # ===== 质量闸门：任何一项不过都不允许部署 =====
      - name: Lint
        run: pnpm run lint

      - name: Type check
        run: pnpm run typecheck

      - name: Unit tests
        run: pnpm run test

      - name: Build
        run: pnpm run build
        env:
          # 准入口令从 GitHub Secrets 注入，不进仓库
          VITE_APP_COUPLE_PWD: ${{ secrets.VITE_APP_COUPLE_PWD }}
          VITE_APP_NORMAL_PWD: ${{ secrets.VITE_APP_NORMAL_PWD }}
          VITE_APP_NOVEL_CODE: ${{ secrets.VITE_APP_NOVEL_CODE }}

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v5
